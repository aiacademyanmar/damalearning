name: Build Dhamma Learning AI V2.2.4 — Manual PAID Auto License
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Download V2.2.4 Manual PAID Auto License source ZIP
        run: |
          python -m pip install --disable-pip-version-check gdown
          gdown 1_rJ8AfrMvWPX8H2Lir_6XPrTOTvFxJw5 -O source.zip
          echo "a50896f0fec8151dd751ccbe09feec6bc9254fe2e4078c8246b102a80d42db51  source.zip" | sha256sum -c -
          unzip -oq source.zip
      - name: Update legacy version assertions for V2.2.4
        run: |
          python - <<'PY'
          from pathlib import Path
          for p in Path('content').glob('verify_*.py'):
              s = p.read_text(encoding='utf-8')
              s = s.replace('versionCode = 20', 'versionCode = 21').replace('versionName = "2.2.3"', 'versionName = "2.2.4"')
              p.write_text(s, encoding='utf-8')
          PY
      - name: Validate native reader, server integration and Q&A
        run: |
          python content/verify_certificate_rule_v201.py
          python content/verify_native_book_reader_v210.py
          python content/verify_server_host_v212.py
          python content/verify_agent_v52_integration.py
          python content/validate_qa_v17.py
          python content/verify_premium_auto_unlock_v222.py
          python content/verify_manual_payment_v224.py
      - name: PHP syntax check for additive server patch
        run: |
          sudo apt-get update
          sudo apt-get install -y php-cli
          find server_patch -name '*.php' -print0 | xargs -0 -n1 php -l
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Install Android SDK components
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          yes | "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Verify APK
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          unzip -t app/build/outputs/apk/debug/app-debug.apk | tail -1
          sha256sum app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Dhamma-Learning-AI-V2.2.4-Central-Admin-Orders-Accounts-Premium-QA-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
