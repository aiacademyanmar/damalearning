name: Build Dhamma Learning AI V1.8 Offline APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Load source from Drive
        run: |
          python -m pip install gdown
          gdown 1i2vo44sgS7XigbIjCMmyYuSlzRfUtsXZ -O source.zip
          echo "93d5f5947bcd85749ca5619498265e8c9857cd8cb62472db712b1099b8c0b017  source.zip" | sha256sum -c -
          unzip -oq source.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build APK with SDK available on Ubuntu runner
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'
          gradle :app:assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: Dhamma-Learning-AI-V1.8-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
