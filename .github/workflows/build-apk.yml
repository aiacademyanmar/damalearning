name: Build Dhamma Learning AI V1.8 Offline APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Retrieve V1.8 source from the linked Drive backup
        run: |
          python -m pip install --disable-pip-version-check gdown
          gdown --id 1i2vo44sgS7XigbIjCMmyYuSlzRfUtsXZ -O source.zip
          echo "93d5f5947bcd85749ca5619498265e8c9857cd8cb62472db712b1099b8c0b017  source.zip" | sha256sum --check
          unzip -oq source.zip -d .
          test -f settings.gradle.kts
          test -f app/build.gradle.kts
          test -f app/src/main/assets/book.html
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - uses: android-actions/setup-android@v3
      - name: Install API 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Validate offline content
        run: |
          python -m pip install --disable-pip-version-check beautifulsoup4
          python content/verify_offline_v18.py
          python content/validate_qa_v17.py
      - name: Build APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Verify APK
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          unzip -t app/build/outputs/apk/debug/app-debug.apk | tail -1
          sha256sum app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: Dhamma-Learning-AI-V1.8-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
