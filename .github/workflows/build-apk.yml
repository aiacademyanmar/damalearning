name: Build Dhamma Learning AI V2.1.1 Native Reader APK — Build Fix 1
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Load V2.1.1 native reader source from Google Drive
        run: |
          python -m pip install --disable-pip-version-check gdown
          gdown 19-PbscSEHbdMnaWI8opJO3oJPfje6ZqT -O source.zip
          echo "a763c32242f2bdad34233f6656d4e84c97afba39822189fbed5e1fd7286e35df  source.zip" | sha256sum -c -
          unzip -oq source.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Install Android SDK components
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          yes | "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Validate offline content, prompts, exam and chapter reader
        run: |
          python content/verify_certificate_rule_v201.py
          python content/verify_native_book_reader_v210.py
      - name: Validate Central Admin PHP patch syntax
        run: |
          sudo apt-get update
          sudo apt-get install -y php-cli
          find server_patch -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Verify APK
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          unzip -t app/build/outputs/apk/debug/app-debug.apk | tail -1
          sha256sum app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Dhamma-Learning-AI-V2.1.1-Native-Reader-Build-Fix1-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
